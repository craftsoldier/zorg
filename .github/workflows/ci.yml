name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS · ${{ matrix.store }}
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - mode: standalone
            store: Secure Enclave (age)
          - mode: packaged
            store: Keychain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --no-default-features --features ${{ matrix.mode }} -- -D warnings

      - name: Run tests
        run: cargo test --locked --no-default-features --features ${{ matrix.mode }}

      - name: Build release binary
        run: cargo build --locked --release --no-default-features --features ${{ matrix.mode }}

  dependency-audit:
    name: Dependency advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
